name: Update OCC Data

on:
  schedule:
    # احتياطي واحد فقط: 9:00 صباحًا بتوقيت السعودية = 06:00 UTC
    # (التشغيل الأساسي يأتي من cron-job الخارجي عبر workflow_dispatch)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-occ-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "== الإصدارات المثبتة (لتثبيتها لاحقًا في requirements.txt) =="
          pip freeze | grep -iE '^(requests|yfinance)==' || true

      - name: Fetch OCC → JSON
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/fetch_occ.py

      - name: Validate data
        run: python scripts/validate_data.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: OCC snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed"
              exit 0
            fi
            echo "retry $i ..."
            sleep 5
          done
          echo "فشل الدفع بعد 3 محاولات"
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="فشل تحديث بيانات OCC"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -z "$open" ]; then
            gh issue create --title "$title" \
              --body "فشل التشغيل: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "يوجد Issue مفتوح (#$open) — لن يُنشأ آخر"
          fi
